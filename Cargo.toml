[package]
name = "mk"
version = "0.6.0"
edition = "2024"
description = "CLI to automate keyboard input on Linux, Windows and macOS"
license = "MIT"

[lib]
name = "mk"
path = "src/lib.rs"


[[bin]]
name = "mk"
path = "src/main.rs"

[[bin]]
name = "mk-daemon"
path = "src/bin/mk-daemon.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
chrono = "0.4"
xcap = "0.9.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"


[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
xkbcommon-dl = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = { version = "0.25.1", features = ["clipboard"] }
windows-sys = { version = "0.52", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory"
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
foreign-types = "0.5.0"


[profile.release]
strip = true
